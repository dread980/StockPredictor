[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpred"
version = "0.2.0"
description = "Next-day equity forecasting with an honest backtest: no look-ahead, real Indian trading costs, and baselines that have to be beaten."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SATYAM" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "joblib>=1.3",
    "typer>=0.9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
tuning = ["optuna>=3.4"]
explain = ["shap>=0.44"]
validate = ["pandera>=0.19"]
app = ["streamlit>=1.30", "plotly>=5.18"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
]

[project.scripts]
stockpred = "stockpred.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
files = ["src/stockpred"]
# The scientific stack and the optional boosting/shap/streamlit extras ship
# no stubs, and several are not even installed in a bare environment, so
# unresolved third-party imports are treated as Any rather than errors.
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
